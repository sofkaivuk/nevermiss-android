name: Build NeverMiss Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NeverMiss-Android-v0.1-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: unzip -q NeverMiss-Android-v0.1-source.zip
      - name: Compile signed debug APK
        working-directory: NeverMiss-Android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NeverMiss-debug-apk
          path: NeverMiss-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
